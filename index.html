<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanad AI - Cultural Customer Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0c0a12;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #241e36;
        }

        header h1 {
            font-size: 26px;
            color: #ffffff;
        }

        header h1 span {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 992px) {
            .container {
                grid-template-columns: 1.2fr 1fr;
            }
        }

        /* كرت لوحة التحكم والجدول */
        .panel {
            background-color: #13101f;
            border: 1px solid #241e36;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #c084fc;
            border-bottom: 1px solid #241e36;
            padding-bottom: 10px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 13px;
        }

        th {
            color: #9ca3af;
            padding: 10px;
            border-bottom: 2px solid #241e36;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #241e36;
            color: #e5e7eb;
        }

        /* كرت الشات الـ Widget */
        .chat-widget {
            background-color: #13101f;
            border: 1px solid #241e36;
            border-radius: 12px;
            height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #1a162b;
            padding: 15px;
            border-bottom: 1px solid #241e36;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0f0d1a;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .msg.bot {
            background-color: #241e36;
            color: #e5e7eb;
            align-self: flex-start;
            border-right: 3px solid #a855f7;
        }

        .msg.user {
            background-color: #4f46e5;
            color: #ffffff;
            align-self: flex-end;
        }

        /* الردود السريعة */
        .quick-replies {
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: #0f0d1a;
        }

        .reply-btn {
            background-color: #1a162b;
            border: 1px solid #312a4f;
            color: #d1d5db;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reply-btn:hover {
            border-color: #a855f7;
            color: #ffffff;
            background-color: #241e36;
        }

        /* شريط الإدخال السفلي */
        .chat-footer {
            padding: 12px;
            border-top: 1px solid #241e36;
            display: flex;
            gap: 8px;
            background-color: #1a162b;
        }

        .chat-input {
            flex: 1;
            background-color: #0c0a12;
            border: 1px solid #312a4f;
            border-radius: 6px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #a855f7;
        }

        .send-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;

            cursor: pointer
